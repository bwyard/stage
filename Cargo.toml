[workspace]
members = [
    "crates/stage-nav",
    "crates/stage-combat",
    "crates/stage-economy",
    "crates/stage-quest",
    "crates/stage-ai",
    "crates/stage-proc",
    "crates/stage-loop",
]
resolver = "2"

[workspace.dependencies]
glam          = "0.27"
rand          = { version = "0.8", features = ["small_rng"] }
rand_pcg      = "0.3"
prime-random  = { path = "../prime/crates/prime-random" }
prime-interp  = { path = "../prime/crates/prime-interp" }
prime-signal  = { path = "../prime/crates/prime-signal" }
prime-sdf     = { path = "../prime/crates/prime-sdf" }
prime-spatial = { path = "../prime/crates/prime-spatial" }

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/bwyard/stage"
